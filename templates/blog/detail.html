{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 py-16">
  <h1 class="text-4xl font-bold">{{ post.title }}</h1>
  <div class="mt-4 flex flex-wrap gap-2">
    {% for tag in post.tags.all %}<span class="chip">{{ tag.name }}</span>{% endfor %}
  </div>
  <div class="prose prose-invert max-w-none mt-8">{{ post.content|safe }}</div>
</section>
{% endblock %}
