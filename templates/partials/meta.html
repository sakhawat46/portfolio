{% load static %}
<title>{% if meta_title %}{{ meta_title }}{% elif site_settings %}{{ site_settings.site_name }}{% else %}Portfolio{% endif %}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{% firstof meta_description site_settings.default_meta_description 'Portfolio website' %}">
<meta property="og:title" content="{% if meta_title %}{{ meta_title }}{% elif site_settings %}{{ site_settings.site_name }}{% else %}Portfolio{% endif %}">
<meta property="og:description" content="{% firstof meta_description site_settings.default_meta_description 'Portfolio website' %}">
<meta property="og:type" content="{% firstof og_type 'website' %}">
{% if request.path %}<meta property="og:url" content="{{ request.build_absolute_uri }}">{% endif %}
{% if object.featured_image %}<meta property="og:image" content="{{ object.featured_image.url }}">{% elif post.cover_image %}<meta property="og:image" content="{{ post.cover_image.url }}">{% endif %}
