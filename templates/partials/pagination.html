{% if page_obj and page_obj.paginator.num_pages > 1 %}
<div class="mt-10 flex gap-2 items-center">
  {% if page_obj.has_previous %}
    <a class="btn-secondary" href="?page={{ page_obj.previous_page_number }}">Previous</a>
  {% endif %}
  <span class="text-sm text-slate-300">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn-secondary" href="?page={{ page_obj.next_page_number }}">Next</a>
  {% endif %}
</div>
{% endif %}
